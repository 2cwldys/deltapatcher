[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deltapatcher"
# the version is deltapatcher/__init__.py's __version__ (set it with tools/version.py)
dynamic = ["version"]
description = "Delta patching with SHA-256 blobs: publish a folder, serve it anywhere, update clients with only what changed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Software Distribution",
]

[project.optional-dependencies]
# making SSH keys and signing keys, and signing releases (checking signatures needs nothing extra)
sign = ["cryptography>=41", "bcrypt>=4"]

[project.scripts]
deltapatcher = "deltapatcher.__main__:main"

[tool.setuptools]
packages = ["deltapatcher"]

[tool.setuptools.dynamic]
version = { attr = "deltapatcher.__version__" }

[tool.setuptools.package-data]
deltapatcher = ["assets/*.ico", "assets/*.png"]
