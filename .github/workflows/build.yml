# Each system on its own: the tests, then the engine and the app, uploaded as that system's artifact.
# Each system's engine (PyInstaller) has to be built on that system, so each app is built there too,
# and a failure on one system does not stop the others.
name: Builds

# A push or pull request that changes only the files in paths-ignore builds nothing: guides, pictures, examples and
# the tools that make the docs. A tag always builds (GitHub applies no path filter to a tag), and so does Run
# workflow. The guides the engine carries for its MCP server are taken in by the next build.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/images/**"
      - "docker/**"
      - "mcp/examples/**"
      - "tools/features/**"
      - "tools/readme_preview/**"
      - "tools/capture_screens.py"
      - "tools/make_preview.py"
      - "tools/secret_scan.py"
      - "tools/wiki.py"
      - ".gitleaks.toml"
      - ".mcp.json"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/secret-scan.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/images/**"
      - "docker/**"
      - "mcp/examples/**"
      - "tools/features/**"
      - "tools/readme_preview/**"
      - "tools/capture_screens.py"
      - "tools/make_preview.py"
      - "tools/secret_scan.py"
      - "tools/wiki.py"
      - ".gitleaks.toml"
      - ".mcp.json"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/secret-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux on 22.04: a program PyInstaller builds needs the build machine's glibc or newer, and 22.04's
        # (2.35) is old enough for Debian 12, the base of most Docker images and Pterodactyl eggs
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      # no Git LFS: the tests use no pictures, and tools/make_icon.py draws the icons
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      # one known Python on every system (the build tools need 3.11 or later; the engine runs on 3.8+)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # every copy of the version agrees, and a release tag (v1.2.3) names the same version
      - name: the version
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python tools/version.py --tag "$TAG"
      # the tests with only what running the engine needs (requirements.txt), so a missing package shows
      # here; each failing test also becomes an annotation, readable without signing in to GitHub.
      # libtorrent too (requirements-torrent.txt): DP_REQUIRE_TORRENT=1 makes a torrent test that cannot run fail,
      # not skip. The torrent tests listen on 127.0.0.x only; macOS answers on 127.0.0.1 alone until the others are
      # added.
      - name: the engine's tests
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          DP_REQUIRE_TORRENT: "1"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; VPY=.venv-test/Scripts/python; else PY=python3; VPY=.venv-test/bin/python; fi
          if [ "$RUNNER_OS" = "macOS" ]; then for i in $(seq 2 99); do sudo ifconfig lo0 alias 127.0.0.$i up; done; fi
          $PY -m venv .venv-test
          $VPY -m pip install --disable-pip-version-check -q -r requirements.txt -r requirements-torrent.txt
          set +e
          $VPY -m unittest discover -s tests > tests.log 2>&1
          rc=$?
          set -e
          cat tests.log
          if [ $rc -ne 0 ]; then $VPY tools/ci_annotate.py tests.log; fi
          exit $rc
      - name: the engine (PyInstaller)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; VPY=.venv/Scripts/python; EXE=dist/deltapatcher-cli.exe; else PY=python3; VPY=.venv/bin/python; EXE=dist/deltapatcher-cli; fi
          $PY -m venv .venv
          $VPY -m pip install --disable-pip-version-check -q -r requirements-build.txt
          $VPY tools/make_icon.py
          $VPY -m PyInstaller packaging/deltapatcher.spec --noconfirm --distpath dist --workpath build/pyinstaller
          $EXE --json --no-log version
          if [ "$RUNNER_OS" = "Windows" ]; then ENGINE=dist/engine/deltapatcher-engine.exe; else ENGINE=dist/engine/deltapatcher-engine; fi
          $ENGINE --json --no-log version
          # BitTorrent frozen in (requirements-build.txt): a session on 127.0.0.1, a small torrent made and checked
          $EXE --no-log version --torrent
          $ENGINE --no-log version --torrent
      - name: the app (Electron)
        working-directory: app
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          # Linux: the .tar.gz at gzip level 6 (electron-builder's own level takes minutes); see build.sh
          if [ "$RUNNER_OS" = "Linux" ]; then export ELECTRON_BUILDER_COMPRESSION_LEVEL=6; fi
          npm run dist
      # dist/release/: this system's files named for a GitHub release
      - name: the release files
        shell: bash
        run: python tools/release_files.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deltapatcher-${{ runner.os }}
          if-no-files-found: error
          path: dist/release/*
