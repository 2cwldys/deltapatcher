# electron-builder: the DeltaPatcher app for Windows, Linux and macOS, with the engine inside.
# The engine (deltapatcher-cli, built by PyInstaller from the Python package) must be in
# resources/engine/ first: build.ps1 / build.sh / the build workflow put it there. Each system's
# engine is built on that system, so each system's app is built on that system too.
appId: io.github.deltapatcher
productName: DeltaPatcher
copyright: Copyright (c) 2026 DeltaPatcher contributors
directories:
  buildResources: build
  output: ../dist/app
files:
  - out/**/*
  - package.json
# a project file opens DeltaPatcher with a double-click (the Windows setup and macOS register the type;
# on Linux the AppImage's desktop file says so, where the system reads it); the app takes the file from its
# command line, from a second start while it runs, or from macOS's open-file event
fileAssociations:
  - ext: deltapatch
    name: DeltaPatcher project file
    description: DeltaPatcher project file
    mimeType: application/x-deltapatch
    role: Viewer
extraResources:
  - from: resources/engine
    to: engine
    filter: ['**/*']
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico
win:
  executableName: DeltaPatcher
  icon: build/icon.ico
  # three ways to have it: the setup installs it; the zip runs without installing and, unzipped once, starts
  # as fast as the installed app; the portable .exe is one file to carry, which unpacks the whole app into a
  # temp folder on every start (about ten seconds, longer with a virus scanner)
  artifactName: DeltaPatcher-${version}-windows-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
    - target: portable
      arch: [x64]
portable:
  artifactName: DeltaPatcher-${version}-portable.exe
nsis:
  artifactName: DeltaPatcher-${version}-setup.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: nsis/uninstall.nsh
linux:
  executableName: deltapatcher
  artifactName: DeltaPatcher-${version}-linux-${arch}.${ext}
  icon: build/icon.png
  category: Utility
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
appImage:
  artifactName: DeltaPatcher-${version}.AppImage
mac:
  icon: build/icon.png
  category: public.app-category.utilities
  identity: null
  target:
    - target: dmg
    - target: zip
dmg:
  artifactName: DeltaPatcher-${version}-${arch}.dmg
publish: null
