# Secret scan: every push to main and every pull request.
#
# To make it protect main, on GitHub: Settings > Branches > Add branch ruleset (or rule) for "main" >
# Require status checks to pass > add "secret scan". Also worth turning on: Settings > Code security >
# Secret scanning and Push protection, which stop a secret before it is even pushed.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          fetch-depth: 0
      - name: the project's own rules (tools/secret_scan.py)
        run: python3 tools/secret_scan.py
      - name: gitleaks (default rules plus .gitleaks.toml, the whole history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
