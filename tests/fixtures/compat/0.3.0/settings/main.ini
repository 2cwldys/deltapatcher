; DeltaPatcher settings. Edit with any text editor; a line starting with ; is a comment.
; The window saves its fields here too (comments and order stay). An empty value means the default.
; Never put a passphrase or a private key in this file: keys are named by their file path only.

[update]
; Where releases come from: an http(s) address or a folder.
source_url = @FIXTURE@/release
; The folder to keep up to date (a game folder, for instance).
install_dir = @FIXTURE@/game
; The publisher's public key (ed25519:...). Empty: unsigned releases are fine, and the key of the first signed release is trusted, and only that key after it. off: never check.
trust_key = 
; How many files download at the same time.
workers = 4

[publish]
; The folder to release.
publish_src = 
; Where the release is prepared before it is sent (manifest.json, blobs/, sigs/). Empty: DeltaPatcher's own folder, one for each folder released.
store_dir = 
; The release's name, shown to players.
name = 
; The release's version, shown to players.
version = 
; Files and folders players keep once they have them (their settings): paths inside the folder you release, separated by ; (config/user.cfg; saves/). Patterns like *.ini work too.
protect = 
; Files and folders left out of the release: paths inside the folder you release, separated by ; (screenshots/; notes.txt). Patterns like *.log work too.
leave_out = 
; Sign each release (yes/no).
sign = no
; The signing key's file (the file's path, never the key).
signing_key = @FIXTURE@/home/AppData/Roaming/DeltaPatcher/signing-key.pem
; Write a .htaccess for Apache into the store (yes/no).
htaccess = yes
; The port of 'Serve locally'.
serve_port = 8000

[server]
; Where Release sends the release: sftp (a server over SSH), folder, or local (served from this computer, for testing).
deploy_mode = sftp
; The server's address.
ssh_host = 
; The user deploys log in as.
ssh_user = 
; The server's SSH port.
ssh_port = 22
; The SSH key's file (the file's path, never the key).
ssh_key = @FIXTURE@/home/.ssh/deltapatcher_ed25519
; The folder on the server its web server serves, with forward slashes.
remote_root = 
; The folder Release copies the release to, in folder mode.
deploy_folder = 
; The address players update from: what the web server gives the remote folder or the folder (https://game.example.com/). Shown after each release.
public_url = 

[window]
; Closing the window keeps DeltaPatcher in the tray (yes/no).
close_to_tray = no
; Look for a newer DeltaPatcher once a day and say so (yes/no). Nothing is downloaded without asking.
check_updates = yes

; a note the user wrote, which every later version must keep
[mine]
note = kept
